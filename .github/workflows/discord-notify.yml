name: Discord Notifications

on:
  pull_request:
    types: [opened, closed, reopened]
  push:
    branches: [main]
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.action }}" = "opened" ]; then
              MESSAGE="📥 **[ChatterRoom] New Pull Request**\n**${{ github.event.pull_request.title }}**\nBy: ${{ github.event.pull_request.user.login }}\n${{ github.event.pull_request.html_url }}"
            elif [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              MESSAGE="✅ **[ChatterRoom] PR Merged**\n**${{ github.event.pull_request.title }}**\nMerged by: ${{ github.event.pull_request.merged_by.login }}\n${{ github.event.pull_request.html_url }}"
            else
              MESSAGE="❌ **[ChatterRoom] PR Closed**\n**${{ github.event.pull_request.title }}**\n${{ github.event.pull_request.html_url }}"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            MESSAGE="🚀 **[ChatterRoom] Push to main**\nBy: ${{ github.actor }}\nCommit: ${{ github.event.head_commit.message }}"
          else
            MESSAGE="📋 **[ChatterRoom] Issue ${{ github.event.action }}**\n**${{ github.event.issue.title }}**\n${{ github.event.issue.html_url }}"
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"$MESSAGE\"}" \
            $DISCORD_WEBHOOK
